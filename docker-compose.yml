version: "3.8"

services:
  app:
    build: .
    container_name: sleep-tracker # The URL will automatically be http://sleep-tracker.localhost
    volumes:
      - ./static/data.csv:/app/static/data.csv # Serve the local data.csv live
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.sleep-tracker.loadbalancer.server.port=3000" # Change to match your app's internal port
      
      - "lazyloader=true"
      - "lazyloader.hosts=sleep-tracker.localhost" # Maps the hostname so lazyload can wake the container
      - "lazyloader.stopdelay=5m" # Shuts container down after 5 mins of zero web traffic
    networks:
      - webproxy

networks:
  webproxy:
    external: true
